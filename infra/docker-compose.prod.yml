# Production overrides — image tags from ghcr.io (built by GitHub Actions)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Required env vars: GITHUB_OWNER, TAG (defaults to 'latest')
services:
  frontend:
    image: ghcr.io/${GITHUB_OWNER}/fmc-frontend:${TAG:-latest}
  backend:
    image: ghcr.io/${GITHUB_OWNER}/fmc-backend:${TAG:-latest}
  scraper:
    image: ghcr.io/${GITHUB_OWNER}/fmc-scraper:${TAG:-latest}
