services:

  traefik:
    image: traefik:v3.0
    container_name: fmc-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=false"

  frontend:
    image: ${REGISTRY_URL}/fmc-frontend:${TAG:-latest}
    container_name: fmc-frontend
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-find-my-car.local}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  backend:
    image: ${REGISTRY_URL}/fmc-backend:${TAG:-latest}
    container_name: fmc-backend
    restart: unless-stopped
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=find_my_car
      - DB_USER=${DB_USER:-fmc}
      - DB_PASSWORD=${DB_PASSWORD}
      - SCRAPER_URL=http://scraper:8001
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_MODEL=${GITHUB_MODEL:-gpt-4o-mini}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DAILY_AI_REQUESTS_MAX=${DAILY_AI_REQUESTS_MAX:-5}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-find-my-car.local}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=api-stripprefix"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
    networks:
      - proxy
      - internal

  scraper:
    image: ${REGISTRY_URL}/fmc-scraper:${TAG:-latest}
    container_name: fmc-scraper
    restart: unless-stopped
    environment:
      - LBC_USER_AGENT=${LBC_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mariadb:
    image: mariadb:11
    container_name: fmc-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=find_my_car
      - MARIADB_USER=${DB_USER:-fmc}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  registry:
    image: registry:2
    container_name: fmc-registry
    restart: unless-stopped
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - internal
    ports:
      - "5000:5000"

networks:
  proxy:
    external: false
  internal:
    external: false

volumes:
  mariadb_data:
  registry_data:
