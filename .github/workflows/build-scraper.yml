name: Build Scraper

on:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - '.github/workflows/build-scraper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to self-hosted registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./scraper
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/fmc-scraper:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/fmc-scraper:latest
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/fmc-scraper:cache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/fmc-scraper:cache,mode=max
